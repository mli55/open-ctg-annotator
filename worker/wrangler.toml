name = "decel-review"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Records read BLIND: served with no baseline and no prefill, annotations
# stored one copy per annotator under ann_blind/<annotator>/rec_N. Requires
# the ACCESS_KEYS secret — a JSON object {"<random key>": "annotator-id"},
# one personal key per doctor. These are ALIAS ids: the CTU-CHB record
# numbers appear nowhere the site serves; the only mapping is
# blind_lock.json in research_log, which is never deployed.
BLIND_IDS = "9001,9002,9003"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

# After `wrangler kv namespace create ANN`, paste the returned id below.
[[kv_namespaces]]
binding = "ANN"
id = "84680cfe9de14a5e8af972365a64bb2c"
